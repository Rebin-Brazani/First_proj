name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions"
      - name: get the code
        uses: actions/checkout@v7
      - name: List the files
        run: ls
      - name: gud
        run: echo "gud from GitHub Actions"
      - name: Check the home page has a heading
        run: grep "<h1>" index.html 
      - name: check the style sheet exists
        run: test -f style.css
